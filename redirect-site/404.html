<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@harborclient/sdk docs have moved</title>
    <script>
      (function () {
        var targetBase = 'https://harborclient.github.io/harborclient/sdk';
        var path = location.pathname.replace(/^\/sdk/, '') || '/';
        if (!path.startsWith('/')) path = '/' + path;
        location.replace(targetBase + path + location.search + location.hash);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e8eef7;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        line-height: 1.5;
      }
      a {
        color: #32d2e2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Documentation moved</h1>
      <p>
        Deep links from the old docs site now redirect to
        <a href="https://harborclient.github.io/harborclient/sdk/"
          >https://harborclient.github.io/harborclient/sdk/</a
        >.
      </p>
    </main>
  </body>
</html>
